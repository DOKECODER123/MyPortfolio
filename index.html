<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Doke Surita — Portfolio</title>

<!-- Fonts: Poppins (requested) + Bricolage Grotesque (display, stands in for Bigilia/Magilio) + Caveat (marker/handwriting, stands in for Calfine) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

<!-- Phosphor icons (UI icons) -->
<script src="https://unpkg.com/@phosphor-icons/web"></script>

<!-- Simple Icons (brand logos for tech stack only — Phosphor has no brand marks) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-icons-font@13/font/simple-icons.min.css">

<style>
  :root{
    --bg: #e7efc5;
    --surface: #fffdf5;
    --ink: #19323c;
    --ink-soft: #3c5561;
    --accent: #e08a3e;
    --accent-2: #b4432f;
    --line: rgba(25,50,60,0.18);
    --shadow: 0 18px 40px rgba(25,50,60,0.14);
    --card-shadow: 0 10px 24px rgba(25,50,60,0.10);
    --marker: #19323c;
    --blob-1: rgba(224,138,62,0.24);
    --blob-2: rgba(180,67,47,0.17);
    --blob-3: rgba(25,50,60,0.09);
  }

  [data-theme="dark"]{
    --bg: #19323c;
    --surface: #21404b;
    --ink: #e7efc5;
    --ink-soft: #b9cfa9;
    --accent: #f0a94e;
    --accent-2: #e2735a;
    --line: rgba(231,239,197,0.18);
    --shadow: 0 18px 40px rgba(0,0,0,0.35);
    --card-shadow: 0 10px 24px rgba(0,0,0,0.30);
    --marker: #f0a94e;
    --blob-1: rgba(240,169,78,0.20);
    --blob-2: rgba(226,115,90,0.18);
    --blob-3: rgba(231,239,197,0.07);
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Poppins', sans-serif;
    transition: background 0.5s ease, color 0.5s ease;
    overflow-x:hidden;
    position:relative;
  }

  /* abstract flowing background, sits behind all content, blends with the theme palette */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background:
      linear-gradient(128deg, var(--blob-1) 0%, transparent 38%),
      linear-gradient(155deg, transparent 20%, var(--blob-2) 40%, transparent 62%),
      radial-gradient(ellipse 55% 40% at 12% 15%, var(--blob-1), transparent 70%),
      radial-gradient(ellipse 50% 45% at 90% 10%, var(--blob-2), transparent 70%),
      radial-gradient(ellipse 60% 50% at 20% 95%, var(--blob-3), transparent 70%),
      radial-gradient(ellipse 65% 55% at 100% 85%, var(--blob-1), transparent 70%);
    transition: background 0.5s ease;
  }

  h1,h2,h3, .display{
    font-family: 'Bricolage Grotesque', sans-serif;
    letter-spacing: -0.02em;
    margin:0;
  }

  .marker{
    font-family: 'Caveat', cursive;
    color: var(--marker);
  }

  a{ color: inherit; }

  /* ---------- NAV ---------- */
  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 28px clamp(90px, 12vw, 130px) 0 6vw;
    position: relative;
    z-index: 40;
  }
  .brand{
    font-size: 1.3rem;
    font-weight: 700;
  }
  .hamburger{
    display:none;
    background:none;
    border:none;
    font-size: 1.7rem;
    color: var(--ink);
    cursor:pointer;
    padding: 4px;
    z-index: 41;
  }
  .nav-links{
    display:flex;
    gap: 34px;
    list-style:none;
    padding:0; margin:0;
  }
  .nav-links button{
    background:none;
    border:none;
    font-family:'Poppins',sans-serif;
    font-size:0.95rem;
    color: var(--ink-soft);
    cursor:pointer;
    padding: 6px 2px;
    position:relative;
    transition: color .25s ease;
  }
  .nav-links button:hover, .nav-links button:focus-visible{ color: var(--ink); }
  .nav-links button::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0;
    height:2px; background: var(--accent);
    transform: scaleX(0); transform-origin: left;
    transition: transform .25s ease;
  }
  .nav-links button:hover::after, .nav-links button:focus-visible::after{ transform: scaleX(1); }

  @media (max-width: 720px){
    .hamburger{ display:block; }
    .nav-links{
      position:absolute;
      top: 100%; left:0; right:0;
      flex-direction:column;
      gap:0;
      background: var(--surface);
      box-shadow: var(--shadow);
      max-height: 0;
      overflow:hidden;
      padding: 0 6vw;
      transition: max-height .3s ease, padding .3s ease;
    }
    .nav-links.open{ max-height: 320px; padding: 10px 6vw 18px; }
    .nav-links li{ border-bottom: 1px solid var(--line); }
    .nav-links li:last-child{ border-bottom:none; }
    .nav-links button{ display:block; width:100%; text-align:left; padding: 13px 2px; }
  }

  /* ---------- DARK MODE PULL CORD ---------- */
  .cord-wrap{
    position: fixed;
    top: 0;
    right: clamp(14px, 4vw, 60px);
    display:flex;
    flex-direction:column;
    align-items:center;
    z-index: 50;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
    transform-origin: top center;
    touch-action: none;
  }
  .cord-string{
    width:2px;
    height: 40px;
    background: var(--ink-soft);
    opacity:0.55;
    transition: height .1s ease;
  }
  .cord-pull{
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--surface);
    border: 1.5px solid var(--line);
    box-shadow: var(--card-shadow);
    display:flex; align-items:center; justify-content:center;
    color: var(--accent);
    font-size: 0.95rem;
    transition: transform .2s ease;
  }
  .cord-wrap:hover .cord-pull{ transform: translateY(4px); }
  .cord-wrap.swinging{ animation: swing 0.9s cubic-bezier(.36,.18,.24,1); }
  @keyframes swing{
    0%{ transform: rotate(var(--swing-amp, 14deg)); }
    22%{ transform: rotate(calc(var(--swing-amp, 14deg) * -0.65)); }
    44%{ transform: rotate(calc(var(--swing-amp, 14deg) * 0.35)); }
    66%{ transform: rotate(calc(var(--swing-amp, 14deg) * -0.18)); }
    88%{ transform: rotate(calc(var(--swing-amp, 14deg) * 0.06)); }
    100%{ transform: rotate(0deg); }
  }
  .cord-label{
    font-size: 0.6rem;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-top: 4px;
    text-align:center;
    max-width: 58px;
    line-height:1.25;
  }
  @media (max-width: 480px){
    .cord-label{ display:none; }
    .cord-string{ height: 30px; }
  }

  /* ---------- HERO / FLOATING BOARD ---------- */
  .hero{
    position: relative;
    max-width: 1100px;
    margin: 40px auto 10px;
    height: 760px;
  }

  .polaroid{
    position:absolute;
    left:50%; top: 46%;
    transform: translate(-50%,-50%) rotate(-1.2deg);
    width: 400px;
    background: var(--surface);
    border-radius: 6px;
    box-shadow: var(--shadow);
    padding: 18px 18px 62px;
    z-index: 10;
    cursor: pointer;
    transition: transform .4s cubic-bezier(.19,1,.22,1), box-shadow .4s ease;
  }
  .polaroid:hover, .polaroid:focus-visible{
    transform: translate(-50%,-50%) rotate(-1.2deg) scale(1.07);
    box-shadow: 0 26px 50px rgba(25,50,60,0.24);
  }
  .polaroid:focus-visible{ outline: 2px solid var(--accent); outline-offset: 6px; }
  .polaroid-photo{
    width:100%;
    aspect-ratio: 4/5;
    border-radius: 3px;
    position:relative;
    overflow:hidden;
  }
  .polaroid-photo img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position: top center;
  }
  .polaroid-photo::after{
    content:"View About →";
    position:absolute; inset:0;
    display:flex; align-items:flex-end; justify-content:center;
    padding-bottom: 16px;
    background: linear-gradient(to top, rgba(25,50,60,0.55), transparent 60%);
    color: #fdfdf5;
    opacity: 0;
    font-family:'Poppins',sans-serif;
    font-size:0.85rem;
    font-weight:600;
    transition: opacity .3s ease;
    pointer-events:none;
  }
  .polaroid:hover .polaroid-photo::after, .polaroid:focus-visible .polaroid-photo::after{
    opacity: 1;
  }
  .polaroid-caption{
    position:absolute;
    bottom: 14px; left: 0; right:0;
    text-align:center;
    font-size: 1.9rem;
    line-height: 1;
  }
  .polaroid-tape{
    position:absolute;
    top:-16px; left:50%;
    transform: translateX(-50%) rotate(-3deg);
    width: 120px; height: 30px;
    background: rgba(231,239,197,0.55);
    border: 1px solid rgba(25,50,60,0.12);
  }
  [data-theme="dark"] .polaroid-tape{ background: rgba(231,239,197,0.18); }

  /* floating clickable items */
  .float-item{
    position:absolute;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    cursor:pointer;
    font-family:'Poppins',sans-serif;
    z-index: 12;
    animation: bob 6s ease-in-out infinite;
    transition: transform .25s ease, filter .25s ease;
  }
  .float-item:hover, .float-item:focus-visible{
    transform: scale(1.16) !important;
    filter: drop-shadow(0 14px 18px rgba(0,0,0,0.18));
  }
  .float-item:focus-visible{ outline: 2px solid var(--accent); outline-offset: 6px; }

  .float-card{
    width: 92px; height: 92px;
    border-radius: 16px;
    background: var(--surface);
    box-shadow: var(--card-shadow);
    display:flex; align-items:center; justify-content:center;
    font-size: 2.1rem;
    color: var(--accent);
    border: 1px solid var(--line);
  }
  .float-item.round .float-card{ border-radius:50%; }
  .float-item .float-name{
    font-size: 0.78rem;
    font-weight: 600;
    background: var(--surface);
    padding: 3px 10px;
    border-radius: 999px;
    box-shadow: var(--card-shadow);
    white-space:nowrap;
  }

  .plate .float-card{
    width: auto; padding: 0 16px; height: 56px;
    border-radius: 8px;
    color: var(--ink);
    letter-spacing: 0.04em;
    font-weight:700;
    font-size:1rem;
    background: linear-gradient(180deg, var(--surface), var(--bg));
    border: 2px solid var(--ink);
  }

  .seal .float-card{
    background: radial-gradient(circle at 35% 30%, #d3583f, var(--accent-2));
    color: #fdece4;
    box-shadow: 0 10px 22px rgba(180,67,47,0.4);
  }

  /* real-photo floating objects (laptop, phone, brain, resume) — shown as loose cutouts, not boxed cards */
  .photo-item .float-photo{
    height: 120px;
    width: auto;
    max-width: 130px;
    object-fit: contain;
    display:block;
    filter: drop-shadow(0 12px 16px rgba(0,0,0,0.3));
  }

  /* each object resizes independently — edit any of these on their own */
  #item-works .float-photo{ height: 120px; max-width: 150px; }
  #item-skills .float-photo{ height: 108px; max-width: 130px; }
  #item-experience .float-photo{ height: 118px; max-width: 140px; }
  #item-contact .float-photo{ height: 100px; max-width: 110px; }

  /* positions (desktop) */
  #item-works{ left: 4.5%; top: 12%; animation-delay: .2s; }
  #item-skills{ left: 5%; top: 58%; animation-delay: 1.1s; }
  #item-experience{ right: 8%; top: 8%; animation-delay: .6s; }
  #item-contact{ right: 9%; top: 60%; animation-delay: 1.6s; }
  #item-about{ left: 50%; bottom: 4%; transform: translateX(-50%); animation-delay: 0s; }
  #item-about:hover{ transform: translateX(-50%) scale(1.16) !important; }

  /* captions now live INSIDE each floating object, so they move, hover and scale together with it */
  .float-caption{
    position:absolute;
    bottom: 100%;
    left:50%;
    transform: translateX(-50%);
    margin-bottom: 8px;
    white-space:nowrap;
    font-size: 1.5rem;
    line-height:1.1;
    color: var(--marker);
  }

  @keyframes bob{
    0%{ transform: translateY(0) rotate(-4deg); }
    25%{ transform: translateY(-9px) rotate(3deg); }
    50%{ transform: translateY(-14px) rotate(5deg); }
    75%{ transform: translateY(-6px) rotate(-2deg); }
    100%{ transform: translateY(0) rotate(-4deg); }
  }
  #item-about{ animation-name: bob-about; }
  @keyframes bob-about{
    0%{ transform: translateX(-50%) translateY(0) rotate(-3deg); }
    50%{ transform: translateX(-50%) translateY(-10px) rotate(3deg); }
    100%{ transform: translateX(-50%) translateY(0) rotate(-3deg); }
  }

  @media (prefers-reduced-motion: reduce){
    .float-item, #item-about{ animation: none; }
  }

  /* tablet / small laptop: keep the floating layout but scale it down so nothing overlaps */
  @media (max-width: 1000px) and (min-width: 861px){
    .hero{ height: 700px; }
    .polaroid{ width: 300px; }
    #item-about{ bottom: -1%; }
    .float-card{ width: 74px; height: 74px; font-size: 1.7rem; }
    .plate .float-card{ height: 48px; font-size: 0.85rem; padding: 0 12px; }
    .photo-item .float-photo,
    #item-works .float-photo, #item-skills .float-photo,
    #item-experience .float-photo, #item-contact .float-photo{ height: 82px; max-width: 105px; }
    .float-caption{ font-size: 1.1rem; }
    .float-item .float-name{ font-size: 0.7rem; }
  }

  /* mobile fallback: simple grid, no absolute float */
  @media (max-width: 860px){
    .hero{ height: auto; padding: 0 6vw 20px; }
    .polaroid{ position:relative; top:auto; left:auto; transform:none; margin: 0 auto 34px; width: min(340px, 90vw); grid-column: 1 / -1; }
    .polaroid:hover, .polaroid:focus-visible{ transform: scale(1.05); }
    .float-caption{ display:none; }
    .float-item{
      position:static; animation:none !important;
      min-height: 150px;
      justify-content: flex-end;
    }
    .float-board{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px 16px;
      max-width: 420px;
      margin: 0 auto;
      align-items:end;
      justify-items:center;
    }
    #item-about{ grid-column: 1 / -1; justify-self:center; margin-left: 100px; }
    #item-works .float-photo, #item-skills .float-photo,
    #item-experience .float-photo, #item-contact .float-photo{ height: 92px; max-width: 118px; }
  }

  @media (max-width: 420px){
    .nav{ padding-top: 20px; }
    h1{ font-size: 1.5rem !important; }
    .kicker{ font-size: 1.3rem; }
    .intro-line{ font-size: 0.88rem; padding: 0 4vw; }
    .polaroid{ padding: 14px 14px 48px; }
    .polaroid-caption{ font-size: 1.5rem; }
    .float-card{ width: 68px; height: 68px; font-size: 1.5rem; }
    .plate .float-card{ height: 44px; font-size: 0.8rem; }
    #item-works .float-photo, #item-skills .float-photo,
    #item-experience .float-photo, #item-contact .float-photo{ height: 74px; max-width: 96px; }
    .float-item{ min-height: 128px; }
    .float-item .float-name{ font-size: 0.68rem; }
    .float-board{ gap: 16px 12px; }
    .modal{ border-radius: 14px; }
    .modal-head{ padding: 16px 18px; }
    .modal-head h3{ font-size: 1.25rem; }
    .modal-body{ padding: 16px 18px 24px; }
  }

  @media (max-width: 340px){
    .float-board{ grid-template-columns: 1fr 1fr; gap: 10px; }
    .float-card{ width: 60px; height: 60px; font-size: 1.3rem; }
    #item-works .float-photo, #item-skills .float-photo,
    #item-experience .float-photo, #item-contact .float-photo{ height: 64px; max-width: 82px; }
    .float-item{ min-height: 110px; }
  }

  .intro-line{
    text-align:center;
    max-width: 560px;
    margin: 4px auto 0;
    color: var(--ink-soft);
    font-size: 0.98rem;
  }
  .kicker{
    text-align:center;
    font-family:'Caveat', cursive;
    font-size: 1.6rem;
    color: var(--marker);
    margin-bottom: -6px;
  }

  /* ---------- MARQUEE ---------- */
  .stack-section{
    padding: 70px 0 90px;
    text-align:center;
    overflow:hidden;
  }
  .stack-section h2{ font-size: 2rem; }
  .stack-section p{ color: var(--ink-soft); margin: 10px 0 40px; }

  .marquee{
    display:flex;
    width: max-content;
    gap: 18px;
    animation: scroll 28s linear infinite;
  }
  .marquee:hover{ animation-play-state: paused; }
  .marquee-track{
    overflow:hidden;
    position:relative;
    mask-image: linear-gradient(90deg, transparent, black 8%, black 92%, transparent);
  }
  .tech-card{
    display:flex;
    align-items:center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--card-shadow);
    border-radius: 14px;
    padding: 14px 22px;
    flex-shrink:0;
    font-weight:500;
  }
  .tech-card i{ font-size: 1.4rem; }
  .tech-card i.gh-icon{ color: var(--ink); }

  @keyframes scroll{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }

  footer{
    text-align:center;
    padding: 30px 6vw 50px;
    color: var(--ink-soft);
    font-size: 0.85rem;
  }
  footer a{ color: var(--accent); font-weight:600; text-decoration:none; }

  /* ---------- MODAL ---------- */
  .overlay{
    position: fixed; inset:0;
    background: rgba(10,20,24,0.55);
    backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
    z-index: 100;
    opacity:0; pointer-events:none;
    transition: opacity .4s ease, backdrop-filter .4s ease;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }

  .modal{
    background: var(--surface);
    color: var(--ink);
    width: min(640px, 100%);
    max-height: 82vh;
    border-radius: 20px;
    box-shadow: var(--shadow);
    display:flex;
    flex-direction:column;
    transform: translateY(24px) scale(0.97);
    transition: transform .45s cubic-bezier(.19,1,.22,1), width .35s ease, max-height .35s ease;
  }
  .overlay.open .modal{ transform: translateY(0) scale(1); }
  .modal.modal-lg{
    width: min(920px, 96vw);
    max-height: 88vh;
  }

  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 22px 26px;
    border-bottom: 1px solid var(--line);
  }
  .modal-head h3{ font-size: 1.5rem; display:flex; align-items:center; gap:10px; }
  .modal-head h3 i{ color: var(--accent); }
  .modal-close{
    background: var(--bg);
    border: none;
    width: 36px; height:36px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color: var(--ink);
    font-size: 1.1rem;
    flex-shrink:0;
    transition: transform .2s ease, background .2s ease;
  }
  .modal-close:hover{ transform: rotate(90deg); background: var(--line); }
  .modal-body{
    padding: 22px 26px 30px;
    overflow-y:auto;
  }
  .modal-body h4{
    font-family:'Bricolage Grotesque', sans-serif;
    font-size: 1.05rem;
    margin: 22px 0 6px;
  }
  .modal-body h4:first-child{ margin-top:0; }
  .modal-body p{ margin: 4px 0 10px; color: var(--ink-soft); line-height:1.55; font-size:0.95rem; }
  .modal-body ul{ margin: 6px 0 16px; padding-left: 18px; color: var(--ink-soft); font-size:0.92rem; line-height:1.6; }
  .tag-row{ display:flex; flex-wrap:wrap; gap:8px; margin: 6px 0 14px; }
  .tag{
    display:inline-flex;
    align-items:center;
    gap: 7px;
    background: var(--bg);
    color: var(--ink);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight:500;
  }
  .tag i{ font-size: 1rem; }
  .tag i.gh-icon{ color: var(--ink); }
  .timeline-item{
    border-left: 2px solid var(--accent);
    padding-left: 16px;
    margin-bottom: 20px;
    position:relative;
    max-width: 100%;
  }
  .timeline-item p, .timeline-item h4{ overflow-wrap: break-word; }
  .timeline-item::before{
    content:"";
    position:absolute; left:-6px; top:2px;
    width:10px; height:10px; border-radius:50%;
    background: var(--accent);
  }
  .timeline-item .date{ font-size:0.78rem; color: var(--accent); font-weight:600; }
  .timeline-item h4{ margin: 2px 0 2px; }
  .exp-head{
    display:flex;
    align-items:flex-start;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 6px;
  }
  .exp-logo{
    width: 48px; height: 48px;
    border-radius: 10px;
    object-fit: contain;
    background: #ffffff;
    padding: 6px;
    flex-shrink: 0;
    border: 1px solid var(--line);
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .exp-head-text{ min-width:0; flex:1 1 200px; padding-top: 2px; }
  .exp-head-text h4{ margin:0; line-height:1.35; }

  @media (max-width: 480px){
    .exp-head{ flex-direction:column; align-items:flex-start; gap:8px; }
    .exp-head-text{ flex-basis:auto; }
  }
  .contact-row{
    display:flex; align-items:center; gap:12px;
    padding: 12px 0; border-bottom: 1px solid var(--line);
  }

/* ---------------- THEME TOGGLE ---------------- */
const root = document.documentElement;
const cord = document.getElementById('cordToggle');
const cordIcon = document.getElementById('cordIcon');
const cordLabel = document.getElementById('cordLabel');
const cordString = document.getElementById('cordString');
const cordPull = document.getElementById('cordPull');

function applyTheme(theme){
  root.setAttribute('data-theme', theme);
  cordIcon.className = theme === 'dark' ? 'ph ph-moon-stars' : 'ph ph-sun';
  cordLabel.innerHTML = theme === 'dark' ? 'pull for<br>light mode' : 'pull for<br>night mode';
  localStorage.setItem('theme', theme);
}
applyTheme(localStorage.getItem('theme') || 'light');

function swing(amplitudeDeg){
  cord.classList.remove('swinging');
  void cord.offsetWidth;
  cord.style.setProperty('--swing-amp', amplitudeDeg + 'deg');
  cord.classList.add('swinging');
}

function toggleTheme(amplitudeDeg){
  const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  swing(amplitudeDeg === undefined ? 14 : amplitudeDeg);
}

/* click / keyboard fallback (no drag involved) */
let didDrag = false;
cord.addEventListener('click', () => { if(didDrag){ didDrag = false; return; } toggleTheme(14); });
cord.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleTheme(14); } });

/* drag-to-pull: how far, and which way, you pull decides how it swings back */
let dragging = false, startX = 0, startY = 0;
cord.addEventListener('pointerdown', e => {
  dragging = true; didDrag = false;
  startX = e.clientX; startY = e.clientY;
  cord.classList.remove('swinging');
  cord.setPointerCapture(e.pointerId);
});
cord.addEventListener('pointermove', e => {
  if(!dragging) return;
  const dy = Math.max(0, Math.min(46, e.clientY - startY));
  const dx = Math.max(-30, Math.min(30, e.clientX - startX));
  if(dy > 4 || Math.abs(dx) > 4) didDrag = true;
  cordString.style.height = (40 + dy) + 'px';
  cordPull.style.transform = `translateY(${dy}px) rotate(${dx * 0.4}deg)`;
});
function endCordDrag(e){
  if(!dragging) return;
  dragging = false;
  const dy = Math.max(0, Math.min(46, e.clientY - startY));
  const dx = Math.max(-30, Math.min(30, e.clientX - startX));
  cordString.style.height = '';
  cordPull.style.transform = '';
  const amp = Math.max(8, Math.min(28, dy * 0.5 + Math.abs(dx) * 0.3));
  const signedAmp = dx < 0 ? -amp : amp;
  if(dy > 10 || Math.abs(dx) > 10){
    toggleTheme(signedAmp);
  } else {
    swing(signedAmp * 0.4);
  }
}
cord.addEventListener('pointerup', endCordDrag);
cord.addEventListener('pointercancel', endCordDrag);

function openLightbox(src, alt){
  lightboxImg.src = src;
  lightboxImg.alt = alt || '';
  lightbox.classList.add('open');
}
function closeLightbox(){
  lightbox.classList.remove('open');
  lightboxImg.src = '';
}
document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', e => { if(e.target === lightbox) closeLightbox(); });

function wireGalleryImages(container){
  container.querySelectorAll('.img-carousel img, .gallery-grid img').forEach(img => {
    img.addEventListener('click', () => openLightbox(img.getAttribute('src'), img.getAttribute('alt')));
  });
}

const modalEl = document.querySelector('.modal');
const LARGE_MODALS = ['works', 'about'];

function openModal(key){
  const c = content[key];
  if(!c) return;
  modalTitle.innerHTML = c.title;
  modalBody.innerHTML = c.html;
  wireGalleryImages(modalBody);
  modalEl.classList.toggle('modal-lg', LARGE_MODALS.includes(key));
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

document.querySelectorAll('[data-open]').forEach(el => {
  el.addEventListener('click', () => openModal(el.getAttribute('data-open')));
  if(el.tagName !== 'BUTTON'){
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
    el.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        openModal(el.getAttribute('data-open'));
      }
    });
  }
});
document.getElementById('modalClose').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if(lightbox.classList.contains('open')) closeLightbox();
    else closeModal();
  }
});
</script>
</body>
</html>
